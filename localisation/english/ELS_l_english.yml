###Focus###

#army
 ELS_establish_a_general_staff:0 "The [ROOT.GetAdjective] General Staff"
 ELS_establish_a_general_staff_desc:0 "Our army lacks proper tactics and organization. Establishing a proper general staff will consolidate the weakened military establishment."
 ELS_army_reform:0 "Army Reform"
 ELS_army_reform_desc:0 " Reorganization of the army is a long process. Our new general stuff indicates a need in military maneuvers to train soldiers and educate officers."
 ELS_doctrine_effort:0 "Doctrine Effort"
 ELS_equipment_effort:0 "Equipment Effort"
 ELS_equipment_effort_desc:0 "The limits for what equipment infantry can carry are constantly being pushed. We will focus on giving our troops the best tools available."
 ELS_infantry_camouflage:0 "Infantry Camouflage"
 ELS_infantry_camouflage_desc:0 "Through a careful selection of the uniform material used by our infantry formations, we can achieve a greater level of concealment. This technique will surely be proven useful on flat and open terrains."
 ELS_equipment_effort_2:0 "Modernize Our Small Arms"
 ELS_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 ELS_mechanization_effort:0 "Mechanization Effort"
 ELS_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles we can construct today."
 ELS_doctrine_effort_2:0 "War Games"
 ELS_doctrine_effort_2_desc:0 "The battlefield has changed in the interbellum years and over recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 ELS_establish_a_military_academy:0 "Establish a Military Academy"
 ELS_establish_a_military_academy_desc:0 "Doctrine studies and military knowledge exchange can be facilitated within the walls of the newly founded military academy."
 ELS_equipment_effort_3:0 "Field Piece Research"
 ELS_equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should become a world leader in infantry weapons."
 ELS_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 ELS_army_modernization:0 "Army Modernization"
 ELS_army_modernization_desc:0 "To sustain the harshest military maneuvers and training exercises our soldiers need proper clothes, instruments and equipment."
 ELS_motorization_effort:0 "Motorization Effort"
 ELS_motorization_effort_desc:0 "Mobility and protection are crucial to safely getting infantry into and out of the field. Focusing on these developments will allow us to take action quickly."
 ELS_establish_a_armor_corp:0 "Establish An Armor Corp"
 ELS_establish_a_armor_corp_desc:0 "Recently bought foreign military equipment has inspired local engineers on the development of a new armored vehicle type which appears to be faster, durable and more powerful then we could even imagine."
 ELS_field_hospitals:0 "Improve our Field Hospitals"
 ELS_field_hospitals_desc:0 "Losing talented and experienced soldiers in the battle is an unacceptable luxury under the current circumstances."
 ELS_special_forces:0 "Special Forces"
 ELS_special_forces_desc:0 "We need elite forces; mountain troops and paratroopers should be our priority."
 ELS_signal_companies:0 "Signal Companies"
 ELS_signal_companies_desc:0 "Coordinating strikes and military operations will be severely more effective if we dedicate an additional personnel equipped with communication devices. "
 ELS_modern_logistics:0 "Modern Logistics"
 ELS_modern_logistics_desc:0 "Military loyalty is based on the ability to fight for our cause. If we cannot supply the army with equipment they need, we might experience mutinies and extensive desertering."

#airforce
 ELS_Aviation_Effort:0 "Expand the Airforce"
 ELS_Aviation_Effort_desc:0 "The first step in stimulating our aeronautics industry is the expansion of our country's airports."
 ELS_Foreign_Design:0 "Focus on Foreign Designs"
 ELS_Foreign_Design_desc:0 "We might simply not have enough specialists to develop new planes. Cooperation with foreign engineers is our only option if we want to stay updated."
 ELS_aircraft_england:0 "Study British Aircraft"
 ELS_aircraft_england_desc:0 "Our British colleagues shared multiple light aircraft blueprints with us."
 ELS_aircraft_american:0 "Study American Aircraft"
 ELS_aircraft_american_desc:0 "American engineers have offered their support and provided us with a few fighter prototypes."
 ELS_aircraft_italian:0 "Study Italian Aircraft"
 ELS_aircraft_italian_desc:0 "Joint exercises allowed us to see and later purchase several Italian dive bombers."
 ELS_aircraft_japanese:0 "Study Japanese Aircraft"
 ELS_aircraft_japanese_desc:0 "Our new fighters have been greatly inspired by the speed and maneuverability of Japanese designs."
 ELS_aircraft_soviet:0 "Study Soviet Aircraft"
 ELS_aircraft_soviet_desc:0 "Transpolar flights with our heavy bombers will become commonplace with these modern Soviet designs."
 ELS_aircraft_german:0 "Study German Aircraft"
 ELS_aircraft_german_desc:0 "German engineering is innovative in every way. We have acquired schematics for a new dive bomber design. Our researchers await our approval."
 ELS_Fighter_Competition:0 "Fighter Competition"
 ELS_Fighter_Competition_desc:0 "We shall host an airshow to determine the fastest and most mobile fighter plane model. "
 ELS_Fighter_Competition_EXPL:0 "Gain some §HAircrafts§! from nations where you made an aircraft mission.\n"
 ELS_Close_Air_Support:0 "Close Air Support Modifications"
 ELS_Close_Air_Support_desc:0 "Now that we own foreign fighter licences we can easily modify them to be able provide close air support for our army."
 ELS_Bomber_Competition:0 "Bomber Competition"
 ELS_Bomber_Competition_desc:0 "Our bombers are currently competing in stances of durability, range and carrying power."
 ELS_German_Rocketry:0 "German Rocketry"
 ELS_German_Rocketry_desc:0 "One of the newly developed German rockets has made safe and sound landing on our territory. We can study it before giving it back to the Germans."
 ELS_Shared_Air_Doctrine:0 "By Pattern of Foreign Air Doctrine"
 ELS_Shared_Air_Doctrine_desc:0 "Many skilled pilots showed their skills in the latest competition which inspired our current air doctrine development."
 ELS_Own_Design:0 "Develop Our Own Design"
 ELS_Own_Design_desc:0 "Inspiring national aircraft research will preserve the uniqueness and independence of our airforce."
 ELS_Own_Fighter:0 "Fighter Focus"
 ELS_Own_Fighter_desc:0 "Engineering fast and mobile fighters is a complicated task, which our Air Bureau has successfully completed."
 ELS_Own_Bomber:0 "Bomber Focus"
 ELS_Own_Bomber_desc:0 "Our enemy will see no Sun in the sky as soon as our great new bombers take to the air!"
 ELS_Own_Naval_Bomber:0 "Naval Bomber Focus"
 ELS_Own_Naval_Bomber_desc:0 "The final piece is a properly designed Air-Water aircraft."
 ELS_Own_Air_Doctrine:0 "Our Own Air Doctrine"
 ELS_Own_Air_Doctrine_desc:0 "Unique plane designes have also inspired unique air warfare doctrine."
 ELS_aircraft_design_cooperation:0 "Aircraft Design Cooperation"
 ELS_aircraft_design_cooperation_desc:0 "We have much to learn from our allies, while they have also much to learn from us. Mutual benefits will bring our air research even closer together."

#navy
 ELS_Naval_Effort:0 "Naval Dockyard Effort"
 ELS_Naval_Effort_desc:0 "Having access to the sea opens new trade opportunities and increases our presence around the world."
 ELS_Small_Navy:0 "Focus on Raiding Fleet"
 ELS_Small_Navy_desc:0 "We will bring disruption and chaos to convoys across the open ocean, as our navy hunts their prey."
 ELS_Submarine:0 "New Modern Submarines"
 ELS_Submarine_desc:0 "An effective modern raiding fleet revolves around the submarine."
 ELS_stealth_upgrades:0 "Stealth Upgrades"
 ELS_stealth_upgrades_desc:0 "Striking and disappearing in the open waters is more effective if the enemy cannot locate the submarine. Outfitting our fleet with snorkels would be prudent."
 ELS_Sea_Dominance:0 "Focus on Sea Dominance"
 ELS_Sea_Dominance_desc:0 "Our navy will stand bravely above the water and annihilate any enemy fleet appearing on the horizon. We will show the world that battleships are the future of warfare."
 ELS_Study_Ships:0 "Study Foreign Ship Design"
 ELS_Study_Ships_desc:0 "Our ports are being constantly visited by foreign ships. Several "security inspections" would surely provide more details on the newest ship variants."
 ELS_Ships_American:0 "Mission to [USA.GetAdjective] Naval Yards"
 ELS_Ships_American_desc:0 "Our good relations with US have become even warmer after joint naval yard visits."
 ELS_Ships_England:0 "Mission to [ENG.GetAdjective] Naval Yards"
 ELS_Ships_England_desc:0 "British naval engineers have shown a number of methods to improve the quality and reduce the building time of our light ships."
 ELS_Purchase_Ships:0 "Order Build of Capital Ships"
 ELS_Purchase_Ships_desc:0 ""
 ELS_Dockyards:0 "Expand Dockyard Facilities"
 ELS_Dockyards_desc:0 "To construct a proper navy we need to expand our dockyard facilities to the new shores."
 ELS_Carrier:0 "Carrier Focus"
 ELS_Carrier_desc:0 "The new carrier prototype is being developed by our Naval Bureau."
 ELS_Navy_Aircrafts:0 "Carrier-Based Aircraft Models"
 ELS_Navy_Aircrafts_desc:0 "A carrier without planes is a just metal box floating on top of the ocean. Supplying it with new naval bombers will take time, but is surely worth it."
 ELS_Battleship:0 "Battleship Focus"
 ELS_Battleship_desc:0 "New shiny battlecruiser will be constructed using the newly developed designs. Let our enemies know that we have Fire and Fury of the seas!"
 ELS_Destroyer:0 "Destroyer Focus"
 ELS_Destroyer_desc:0 "Heavy ships are particularly vulnerable to torpedo attacks. Improving and building destroyers will solve this issue."
 ELS_Cruisers:0 "Cruiser Focus"
 ELS_Cruisers_desc:0 "While not as powerful as a battleship or carrier, the heavy cruiser is a fine addition to our naval firepower and requires additional funding."
 ELS_Naval_Doctrine:0 "Improve Naval Doctrine"
 ELS_Naval_Doctrine_desc:0 "New ships will be useless without proper tactics, we should improve our doctrine immediately!"

