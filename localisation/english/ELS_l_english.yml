#political - communist
 ELS_vengeance_for_la_matanza:0 "Vengeance For La Matanza"
 ELS_vengeance_for_la_matanza_desc:0 ""
 ELS_return_of_miguel_marmol:0 "The Return of Miguel Mármol"
 ELS_return_of_miguel_marmol_desc:0 "In 1932 the regime stood Miguel Mármol before a firing squad and left him for dead. He survived, and the party's most stubborn organizer has come out of hiding to lead it again."
 ELS_rebuild_the_party_cells:0 "Rebuild the Party Cells"
 ELS_rebuild_the_party_cells_desc:0 "La Matanza destroyed the Partido Comunista Salvadoreño in a matter of weeks. Small, secret cells of trusted comrades can rebuild it where the Guardia Nacional cannot see."
 ELS_organize_the_coffee_pickers:0 "Organize the Coffee Pickers"
 ELS_organize_the_coffee_pickers_desc:0 "The coffee estates run on the backs of underpaid pickers. Unions on the fincas will give them a voice, and give the party thousands of new recruits."
 ELS_huelga_de_brazos_caidos:0 "Huelga de Brazos Caídos"
 ELS_huelga_de_brazos_caidos_desc:0 "We do not need rifles to bring down the regime. If every worker, picker and clerk folds their arms at once, the country will stop, and the government will fall with it."
 ELS_international_brigades:0 "Join the International Brigades"
 ELS_international_brigades_desc:0 "Workers from across the world are travelling to Spain to defend the Republic against fascism. Salvadoran comrades will stand with them, and our factories will send what arms we can spare."
 ELS_aid_for_the_republic:0 "Aid for the Republic"
 ELS_aid_for_the_republic_desc:0 "The war in Spain has dragged on for over a year, and the Republic is running short of everything. We will send rifles and equipment from our own stockpiles, even if our workers must tighten their belts to pay for it."
 ELS_dissolve_the_guardia_nacional:0 "Dissolve the Guardia Nacional"
 ELS_dissolve_the_guardia_nacional_desc:0 "The Guardia Nacional carried out La Matanza and has terrorised the countryside ever since. It will be disbanded, and the officers who served the old regime will answer for their crimes."
 ELS_peoples_militias:0 "People's Militias"
 ELS_peoples_militias_desc:0 "The revolution will be defended by the people themselves. Militias raised in the towns and fincas will replace the Guardia Nacional."
 ELS_expropriate_the_fourteen_families:0 "Expropriate the Fourteen Families"
 ELS_expropriate_the_fourteen_families_desc:0 "For generations the Fourteen Families have owned the land, the banks and the coffee. Their estates and fortunes now belong to the people."
 ELS_collectivize_the_fincas:0 "Collectivize the Fincas"
 ELS_collectivize_the_fincas_desc:0 "Following the Soviet model, the great coffee estates will become state farms. Production will rise, but the peasants who wanted land of their own will not forgive us easily."
 ELS_coffee_cooperatives:0 "Coffee Cooperatives"
 ELS_coffee_cooperatives_desc:0 "The fincas will be handed to cooperatives run by the pickers who work them. Growth will be slower, but the countryside will stand behind the revolution."
 ELS_repudiate_the_1922_loan:0 "Repudiate the 1922 Loan"
 ELS_repudiate_the_1922_loan_desc:0 "The 1922 loan from American bankers has drained our customs revenue for over a decade. We will not pay another centavo, and the money will build our own industry instead."
 ELS_nationalize_healthcare:0 "Nationalize Healthcare"
 ELS_nationalize_healthcare_desc:0 "Doctors and hospitals have served only those who could pay. The state will take over the clinics and hospitals and bring medical care to every town and finca, free of charge."
 ELS_national_literacy_campaign:0 "National Literacy Campaign"
 ELS_national_literacy_campaign_desc:0 "Most of our workers and peasants cannot read. Brigades of students and teachers will go out to the countryside to teach them, and a people that can read will build a better future."
 ELS_restore_the_tierras_comunales:0 "Restore the Tierras Comunales"
 ELS_restore_the_tierras_comunales_desc:0 "The communal lands of the indigenous villages were abolished to make way for the coffee estates. Returning them to the communities of the west will heal old wounds."

###Events###
 el_salvador.1.t:0 "Joint Army Exercises"
 el_salvador.1.d:0 "El Salvador invites us to participate in regional join army exercises, this would be a valuable opportunity to provide experience to our armed forces."
 el_salvador.1.a:0 "Participate in the exercises"
 el_salvador.1.b:0 "Politely decline"
 el_salvador.2.t:0 "Central American Customs Union"
 el_salvador.2.d:0 "El Salvador has invited us to join the Central American customs union."
 el_salvador.2.a:0 "Join the customs union"
 el_salvador.2.b:0 "Politely decline"
 el_salvador.3.t:0 "Central American Defense Pact"
 el_salvador.3.d:0 "El Salvador invites us to join the Central American Defense Pact"
 el_salvador.3.a:0 "Join the Pact"
 el_salvador.3.b:0 "This is not in our best interests"
 el_salvador.4.t:0 "A Shared Foreign Policy"
 el_salvador.4.d:0 "El Salvador proposes that the nations of Central America speak to the world with one voice. Under their proposal, El Salvador would conduct our foreign affairs while we keep control of our own internal matters."
 el_salvador.4.a:0 "Central America must stand together"
 el_salvador.4.b:0 "We will not give up our independence"
 el_salvador.5.t:0 "The Federal Constitution"
 el_salvador.5.d:0 "El Salvador has drafted a federal constitution to unite Central America into a single nation, the United States of Central America, and invites us to join it."
 el_salvador.5.a:0 "Join the federation"
 el_salvador.5.b:0 "We will remain a separate nation"

